<!doctype html>
<html lang="zh-CN">
<head>
  <link rel="icon" href="data:,">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>东方真珠岛 · Woo Web</title>
  <style>
    :root { color-scheme: dark; font: 16px/1.5 system-ui, sans-serif; }
    body { margin: 0; background: #101319; color: #e8eaf1; }
    main { width: min(960px, calc(100% - 32px)); margin: 24px auto; }
    header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
    h1 { margin: 0; font-size: 23px; font-weight: 600; }
    header p { margin: 3px 0; color: #a9afbd; font-size: 14px; }
    .actions { display: flex; gap: 8px; }
    button { border: 1px solid #454d61; border-radius: 6px; padding: 9px 17px; font: inherit; color: inherit; background: #232b3b; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    button:focus-visible, canvas:focus-visible { outline: 2px solid #b0c9ff; outline-offset: 3px; }
    #status { min-height: 24px; margin: 16px 0 9px; color: #c7cddd; }
    progress { width: 100%; height: 6px; display: block; margin-bottom: 10px; }
    .screen { background: #000; width: 100%; aspect-ratio: 4/3; position: relative; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
    .screen:fullscreen { height: 100vh; }
    .screen:fullscreen canvas { width: min(100vw, calc(100vh * 4 / 3)); height: min(100vh, 75vw); margin: auto; }
    progress[hidden] { display: none; }
    .controls { color: #bdc3d0; margin: 12px 0; }
    kbd { display: inline-block; border: 1px solid #4e576d; border-radius: 4px; padding: 0 5px; color: #eef2ff; font: 14px/1.6 system-ui, sans-serif; }
    details { margin-top: 16px; color: #a9afbd; }
    summary { cursor: pointer; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 220px; overflow: auto; font: 12px/1.5 ui-monospace, monospace; }
  </style>
</head>
<body>
<main>
  <header>
    <div><h1>东方真珠岛</h1><p>Hollow Song of Birds · Woo Web 本地移植预览</p></div>
    <div class="actions"><button id="start">加载游戏</button><button id="fullscreen" disabled>全屏</button></div>
  </header>
  <p id="status" role="status" aria-live="polite">从本机读取原版游戏资源；不会上传或修改原版文件。</p>
  <p id="performance" hidden style="font-size:13px;color:#a9afbd;margin:4px 0 10px"></p>
  <progress id="progress" max="1" value="0" hidden></progress>
  <div class="screen"><canvas id="canvas" width="640" height="480" tabindex="0" aria-label="游戏画面"></canvas></div>
  <p class="controls"><kbd>方向键</kbd> 移动　<kbd>Z</kbd> 确认 / 射击　<kbd>X</kbd> 取消 / 符卡　<kbd>Shift</kbd> 低速　<kbd>Esc</kbd> 暂停</p>
  <details><summary>运行日志</summary><pre id="log"></pre></details>
</main>
<script type="module" src="./shell.mjs"></script>
</body>
</html>
