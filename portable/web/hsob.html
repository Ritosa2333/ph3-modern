<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="eagler-data-provider" content="retail-memory">
  <title>东方真珠岛 ～ Hollow Song of Birds</title>
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000;color:#fff;font:14px/1.4 system-ui,sans-serif}
    #screen{position:absolute;inset:0;display:grid;place-items:center;background:#000}
    canvas{display:block;width:min(100vw,calc(100vh * 4 / 3));height:min(100vh,75vw);max-width:100%;max-height:100%;outline:none;touch-action:none}
    #error{position:absolute;inset:12px;z-index:3;pointer-events:none;white-space:pre-wrap;color:#ffd7d7;text-shadow:0 1px 2px #000}
    #start{display:none;position:absolute;z-index:4;left:12px;top:12px;padding:7px 12px;border:1px solid #777;background:#222;color:#fff;border-radius:5px}
    html[data-standalone="1"] #start{display:block}
  </style>
</head>
<body>
  <div id="screen"><canvas id="canvas" width="640" height="480" tabindex="0" aria-label="东方真珠岛游戏画面"></canvas></div>
  <button id="start" type="button">加载游戏</button>
  <pre id="error" aria-live="assertive"></pre>
  <script type="module" src="./shell.mjs"></script>
</body>
</html>
